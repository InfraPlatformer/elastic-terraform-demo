apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-monitor-exporter
  namespace: monitoring
  labels:
    app: azure-monitor-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-monitor-exporter
  template:
    metadata:
      labels:
        app: azure-monitor-exporter
    spec:
      containers:
      - name: azure-monitor-exporter
        image: prom/azure-exporter:latest
        ports:
        - containerPort: 9276
        env:
        - name: AZURE_SUBSCRIPTION_ID
          value: "your-subscription-id"
        - name: AZURE_TENANT_ID
          value: "your-tenant-id"
        - name: AZURE_CLIENT_ID
          value: "your-client-id"
        - name: AZURE_CLIENT_SECRET
          value: "your-client-secret"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9276
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9276
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: azure-monitor-exporter
  namespace: monitoring
  labels:
    app: azure-monitor-exporter
spec:
  selector:
    app: azure-monitor-exporter
  ports:
  - protocol: TCP
    port: 9276
    targetPort: 9276
  type: ClusterIP

