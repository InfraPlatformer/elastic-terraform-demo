apiVersion: v1
kind: ConfigMap
metadata:
  name: metricbeat-config
  namespace: elastic-monitoring
data:
  metricbeat.yml: |
    metricbeat.config.modules:
      path: ${path.config}/modules.d/*.yml
      reload.enabled: false

    processors:
      - add_host_metadata:
          when.not.contains.tags: forwarded

    output.elasticsearch:
      hosts: '${ELASTICSEARCH_HOSTS:elasticsearch:9200}'
      username: '${ELASTICSEARCH_USERNAME:}'
      password: '${ELASTICSEARCH_PASSWORD:}'

    setup.kibana:
      host: '${KIBANA_HOST:kibana:5601}'

    setup.dashboards.enabled: true
    setup.template.enabled: true

    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/metricbeat
      name: metricbeat
      keepfiles: 7
      permissions: 0644

    monitoring.enabled: true
    monitoring.elasticsearch:
      hosts: '${ELASTICSEARCH_HOSTS:elasticsearch:9200}'
      username: '${ELASTICSEARCH_USERNAME:}'
      password: '${ELASTICSEARCH_PASSWORD:}'

    # System module configuration
    metricbeat.modules:
    - module: system
      metricsets:
        - cpu
        - load
        - memory
        - network
        - process
        - process_summary
        - socket_summary
        - filesystem
        - fsstat
      enabled: true
      period: 10s
      processes: ['.*']
      process.include_top_n:
        by_cpu: 5
        by_memory: 5
      process.include_per_cpu: true
      process.cmdline.cache.enabled: true
      process.cmdline.cache.ttl: 5m
      process.include_cpu_ticks: true

    - module: kubernetes
      metricsets:
        - container
        - node
        - pod
        - system
        - volume
      enabled: true
      period: 10s
      host: ${NODE_NAME}
      hosts: ["https://${NODE_NAME}:10250"]
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      ssl.verification_mode: none
      add_metadata: true

    - module: docker
      metricsets:
        - container
        - cpu
        - diskio
        - healthcheck
        - info
        - memory
        - network
      hosts: ["unix:///var/run/docker.sock"]
      period: 10s
      enabled: true

    - module: elasticsearch
      metricsets:
        - cluster_stats
        - index
        - index_recovery
        - index_summary
        - ml_job
        - node
        - node_stats
        - pending_tasks
        - shard
      period: 10s
      hosts: ["http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"]
      enabled: true

    - module: kibana
      metricsets:
        - stats
      period: 10s
      hosts: ["http://kibana-service.kibana.svc.cluster.local:5601"]
      enabled: true

    - module: prometheus
      metricsets:
        - collector
      period: 10s
      hosts: ["http://prometheus-service.monitoring.svc.cluster.local:9090"]
      metrics_path: /metrics
      enabled: true
