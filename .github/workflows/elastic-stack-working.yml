name: "Elastic Stack - Working CI/CD"

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - 'modules/**'
      - '.github/workflows/**'
      - 'environments/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - 'modules/**'
      - '.github/workflows/**'
      - 'environments/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - development

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-west-2"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # =============================================================================
  # CODE QUALITY & SECURITY
  # =============================================================================
  code-quality:
    name: "Code Quality & Security"
    runs-on: ubuntu-latest
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
      
    - name: "Setup Terraform"
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: "Terraform Format Check"
      run: |
        echo "🔍 Checking Terraform formatting..."
        terraform fmt -check -recursive
        echo "✅ Terraform formatting check completed"
        
    - name: "Terraform Validate - Staging"
      run: |
        echo "🔍 Validating Terraform configuration for staging..."
        cd environments/staging
        terraform init -backend=false
        terraform validate
        echo "✅ Staging validation passed"
        
    - name: "Install Checkov"
      run: |
        echo "🔍 Installing Checkov for security scanning..."
        pip install checkov==3.1.25
        echo "✅ Checkov installed successfully"
        
    - name: "Security Scan with Checkov"
      run: |
        echo "🔍 Running security scan with Checkov..."
        checkov -d . --framework terraform --output sarif --output-file-path checkov-results.sarif --soft-fail
        echo "✅ Security scan completed"
        
    - name: "Upload Checkov results"
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: checkov-results.sarif
        category: "checkov"

  # =============================================================================
  # TERRAFORM PLAN (Only on PRs)
  # =============================================================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'pull_request'
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
      
    - name: "Setup Terraform"
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: "Terraform Plan - Staging"
      run: |
        echo "🔍 Running Terraform plan for staging..."
        cd environments/staging
        terraform init -backend=false
        terraform plan -out=tfplan-staging
        echo "✅ Staging plan completed"
        
    - name: "Comment PR with Plan"
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const plan = fs.readFileSync('environments/staging/tfplan-staging', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan Results\n\`\`\`\n${plan}\n\`\`\``
            });
          } catch (error) {
            console.log('Could not read plan file:', error.message);
          }

  # =============================================================================
  # DEPLOYMENT (Only on main/develop branches)
  # =============================================================================
  deploy:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4
      
    - name: "Setup Terraform"
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: "Setup AWS Credentials"
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: "Deploy to Staging"
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "🚀 Deploying to staging environment..."
        cd environments/staging
        terraform init
        terraform plan -out=tfplan-staging
        terraform apply tfplan-staging -auto-approve
        echo "✅ Staging deployment completed"
        
    - name: "Deploy to Production"
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deploying to production environment..."
        cd environments/production
        terraform init
        terraform plan -out=tfplan-production
        terraform apply tfplan-production -auto-approve
        echo "✅ Production deployment completed"
        
    - name: "Verify Deployment"
      run: |
        echo "🔍 Verifying deployment..."
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name elastic-stack-cluster
        kubectl get pods --all-namespaces
        echo "✅ Deployment verification completed"

  # =============================================================================
  # NOTIFICATION
  # =============================================================================
  notify:
    name: "Send Notification"
    runs-on: ubuntu-latest
    needs: [code-quality, terraform-plan, deploy]
    if: always()
    
    steps:
    - name: "Success Notification"
      if: needs.deploy.result == 'success'
      run: |
        echo "✅ Elastic Stack deployment successful!"
        echo "Environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
        echo "Cluster: elastic-stack-cluster"
        
    - name: "Failure Notification"
      if: needs.deploy.result == 'failure'
      run: |
        echo "❌ Elastic Stack deployment failed!"
        echo "Please check the workflow logs for details."
