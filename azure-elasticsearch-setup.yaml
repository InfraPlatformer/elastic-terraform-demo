apiVersion: v1
kind: Namespace
metadata:
  name: azure-elasticsearch
  labels:
    name: azure-elasticsearch
    environment: production
    cloud: azure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-elasticsearch-config
  namespace: azure-elasticsearch
data:
  elasticsearch.yml: |
    cluster.name: azure-elasticsearch-cluster
    node.name: azure-elasticsearch-node
    network.host: 0.0.0.0
    http.port: 9200
    transport.port: 9300
    discovery.type: single-node
    xpack.security.enabled: false
    xpack.monitoring.collection.enabled: true
    xpack.ml.enabled: false
    xpack.watcher.enabled: false
    xpack.graph.enabled: false
    xpack.reporting.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false
    # Azure specific optimizations
    bootstrap.memory_lock: true
    indices.memory.index_buffer_size: 20%
    indices.queries.cache.size: 10%
    thread_pool.write.queue_size: 1000
    thread_pool.search.queue_size: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: azure-elasticsearch-service
  namespace: azure-elasticsearch
  labels:
    app: azure-elasticsearch
spec:
  selector:
    app: azure-elasticsearch
  ports:
  - port: 9200
    targetPort: 9200
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: azure-elasticsearch-loadbalancer
  namespace: azure-elasticsearch
  labels:
    app: azure-elasticsearch
spec:
  selector:
    app: azure-elasticsearch
  ports:
  - port: 80
    targetPort: 9200
    protocol: TCP
  type: LoadBalancer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: azure-elasticsearch
  namespace: azure-elasticsearch
  labels:
    app: azure-elasticsearch
spec:
  serviceName: azure-elasticsearch-service
  replicas: 1
  selector:
    matchLabels:
      app: azure-elasticsearch
  template:
    metadata:
      labels:
        app: azure-elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: cluster.name
          value: "azure-elasticsearch-cluster"
        - name: node.name
          value: "azure-elasticsearch-node"
        - name: discovery.type
          value: "single-node"
        - name: ES_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: bootstrap.memory_lock
          value: "true"
        - name: xpack.security.enabled
          value: "false"
        - name: xpack.security.transport.ssl.enabled
          value: "false"
        - name: xpack.security.http.ssl.enabled
          value: "false"
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: azure-elasticsearch-config
          mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
          subPath: elasticsearch.yml
        - name: azure-elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: azure-elasticsearch-config
        configMap:
          name: azure-elasticsearch-config
      - name: azure-elasticsearch-data
        emptyDir: {}
      restartPolicy: Always
  volumeClaimTemplates:
  - metadata:
      name: azure-elasticsearch-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

