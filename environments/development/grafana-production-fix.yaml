apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-production
  namespace: monitoring
  labels:
    app: grafana-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-production
  template:
    metadata:
      labels:
        app: grafana-production
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_SERVER_PUBLIC_BASE_URL
          value: "http://a7d87a61727ab428cbfbc1d4e7c7ebff-1414806497.us-west-2.elb.amazonaws.com:3000"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        - name: GF_SECURITY_DISABLE_GRAVATAR
          value: "true"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "elasticsearch"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-production-service
  namespace: monitoring
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana-production

