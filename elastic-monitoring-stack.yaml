apiVersion: v1
kind: Namespace
metadata:
  name: elastic-monitoring
  labels:
    name: elastic-monitoring
    environment: production
---
# Metricbeat for system and application metrics
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metricbeat
  namespace: elastic-monitoring
  labels:
    app: metricbeat
spec:
  selector:
    matchLabels:
      app: metricbeat
  template:
    metadata:
      labels:
        app: metricbeat
    spec:
      serviceAccountName: metricbeat
      terminationGracePeriodSeconds: 30
      containers:
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.11.0
        args:
          - -c
          - /etc/metricbeat.yml
          - -e
          - -system.hostfs=/hostfs
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: KIBANA_HOST
          value: "http://kibana-service.kibana.svc.cluster.local:5601"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "200Mi"
            cpu: "100m"
          limits:
            memory: "500Mi"
            cpu: "200m"
        volumeMounts:
        - name: config
          mountPath: /etc/metricbeat.yml
          readOnly: true
          subPath: metricbeat.yml
        - name: data
          mountPath: /usr/share/metricbeat/data
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: proc
          mountPath: /hostfs/proc
          readOnly: true
        - name: cgroup
          mountPath: /hostfs/sys/fs/cgroup
          readOnly: true
        - name: hostfs
          mountPath: /hostfs
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: metricbeat-config
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: varlog
        hostPath:
          path: /var/log
      - name: proc
        hostPath:
          path: /proc
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: hostfs
        hostPath:
          path: /
      - name: data
        hostPath:
          path: /var/lib/metricbeat-data
          type: DirectoryOrCreate
---
# Filebeat for log collection
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: elastic-monitoring
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.11.0
        args:
          - -c
          - /etc/filebeat.yml
          - -e
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: KIBANA_HOST
          value: "http://kibana-service.kibana.svc.cluster.local:5601"
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "200Mi"
            cpu: "100m"
          limits:
            memory: "500Mi"
            cpu: "200m"
        volumeMounts:
        - name: config
          mountPath: /etc/filebeat.yml
          readOnly: true
          subPath: filebeat.yml
        - name: data
          mountPath: /usr/share/filebeat/data
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: filebeat-config
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlogpods
        hostPath:
          path: /var/log/pods
      - name: data
        hostPath:
          path: /var/lib/filebeat-data
          type: DirectoryOrCreate
---
# Heartbeat for uptime monitoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat
  namespace: elastic-monitoring
  labels:
    app: heartbeat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heartbeat
  template:
    metadata:
      labels:
        app: heartbeat
    spec:
      serviceAccountName: heartbeat
      containers:
      - name: heartbeat
        image: docker.elastic.co/beats/heartbeat:8.11.0
        args:
          - -c
          - /etc/heartbeat.yml
          - -e
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: KIBANA_HOST
          value: "http://kibana-service.kibana.svc.cluster.local:5601"
        resources:
          requests:
            memory: "100Mi"
            cpu: "50m"
          limits:
            memory: "200Mi"
            cpu: "100m"
        volumeMounts:
        - name: config
          mountPath: /etc/heartbeat.yml
          readOnly: true
          subPath: heartbeat.yml
        - name: data
          mountPath: /usr/share/heartbeat/data
      volumes:
      - name: config
        configMap:
          name: heartbeat-config
      - name: data
        emptyDir: {}
---
# APM Server for application performance monitoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-server
  namespace: elastic-monitoring
  labels:
    app: apm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apm-server
  template:
    metadata:
      labels:
        app: apm-server
    spec:
      serviceAccountName: apm-server
      containers:
      - name: apm-server
        image: docker.elastic.co/apm/apm-server:8.11.0
        args:
          - -c
          - /etc/apm-server.yml
          - -e
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: KIBANA_HOST
          value: "http://kibana-service.kibana.svc.cluster.local:5601"
        ports:
        - containerPort: 8200
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: config
          mountPath: /etc/apm-server.yml
          readOnly: true
          subPath: apm-server.yml
        - name: data
          mountPath: /usr/share/apm-server/data
      volumes:
      - name: config
        configMap:
          name: apm-server-config
      - name: data
        emptyDir: {}
---
# APM Server Service
apiVersion: v1
kind: Service
metadata:
  name: apm-server-service
  namespace: elastic-monitoring
  labels:
    app: apm-server
spec:
  selector:
    app: apm-server
  ports:
  - port: 8200
    targetPort: 8200
    protocol: TCP
  type: ClusterIP
---
# APM Server LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: apm-server-loadbalancer
  namespace: elastic-monitoring
  labels:
    app: apm-server
spec:
  selector:
    app: apm-server
  ports:
  - port: 80
    targetPort: 8200
    protocol: TCP
  type: LoadBalancer
---
# Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: elastic-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: elastic-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heartbeat
  namespace: elastic-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apm-server
  namespace: elastic-monitoring
---
# ClusterRole for monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-monitoring
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - pods
  - services
  - events
  - endpoints
  - persistentvolumes
  - persistentvolumeclaims
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - deployments
  - daemonsets
  - replicasets
  - ingresses
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources:
  - nodes
  - pods
  verbs: ["get", "list"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-monitoring
roleRef:
  kind: ClusterRole
  name: elastic-monitoring
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: elastic-monitoring
- kind: ServiceAccount
  name: filebeat
  namespace: elastic-monitoring
- kind: ServiceAccount
  name: heartbeat
  namespace: elastic-monitoring
- kind: ServiceAccount
  name: apm-server
  namespace: elastic-monitoring

