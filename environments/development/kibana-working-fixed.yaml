apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana-working
  namespace: elasticsearch
  labels:
    app: kibana-working
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana-working
  template:
    metadata:
      labels:
        app: kibana-working
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.11.0
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: XPACK_FLEET_ENABLED
          value: "false"
        - name: XPACK_INGEST_MANAGER_ENABLED
          value: "false"
        - name: XPACK_SECURITY_ENCRYPTION_KEY
          value: "something_at_least_32_characters_long"
        - name: XPACK_ENCRYPTED_SAVED_OBJECTS_ENCRYPTION_KEY
          value: "something_at_least_32_characters_long"
        - name: XPACK_LICENSE_SELF_GENERATED_TYPE
          value: "basic"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "elasticsearch"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-working-service
  namespace: elasticsearch
spec:
  type: LoadBalancer
  ports:
  - port: 5601
    targetPort: 5601
  selector:
    app: kibana-working

