apiVersion: v1
kind: ConfigMap
metadata:
  name: metricbeat-config
  namespace: elasticsearch
data:
  metricbeat.yml: |
    metricbeat.config.modules:
      path: /modules.d/*.yml
      reload.enabled: false
    metricbeat.modules:
    - module: elasticsearch
      metricsets: ["cluster", "node", "node_stats", "cluster_stats"]
      period: 10s
      hosts: ["http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"]
    - module: system
      metricsets: ["cpu", "load", "memory", "network", "process", "process_summary", "socket_summary"]
      enabled: true
      period: 10s
      processes: ['.*']
    output.elasticsearch:
      hosts: ["http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"]
      index: "metricbeat-%{+yyyy.MM.dd}"
    setup.template.enabled: true
    setup.template.name: "metricbeat"
    setup.template.pattern: "metricbeat-*"
    setup.kibana:
      host: "http://kibana-working-service.elasticsearch.svc.cluster.local:5601"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metricbeat-working
  namespace: elasticsearch
  labels:
    app: metricbeat-working
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metricbeat-working
  template:
    metadata:
      labels:
        app: metricbeat-working
    spec:
      serviceAccountName: metricbeat
      containers:
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.11.0
        args:
          - -c
          - /etc/metricbeat.yml
          - -e
        env:
        - name: ELASTICSEARCH_HOST
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: KIBANA_HOST
          value: "http://kibana-working-service.elasticsearch.svc.cluster.local:5601"
        volumeMounts:
        - name: config
          mountPath: /etc/metricbeat.yml
          subPath: metricbeat.yml
        - name: data
          mountPath: /usr/share/metricbeat/data
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 200m
            memory: 512Mi
        tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "elasticsearch"
          effect: "NoSchedule"
      volumes:
      - name: config
        configMap:
          defaultMode: 0600
          name: metricbeat-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: elasticsearch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metricbeat
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - events
  - pods
  - services
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - replicasets
  - statefulsets
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: elasticsearch
roleRef:
  kind: ClusterRole
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io
