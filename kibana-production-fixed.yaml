apiVersion: v1
kind: Namespace
metadata:
  name: kibana
  labels:
    name: kibana
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: kibana
data:
  kibana.yml: |
    server.name: kibana-production
    server.host: "0.0.0.0"
    server.port: 5601
    elasticsearch.hosts: ["http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"]
    elasticsearch.requestTimeout: 300000
    elasticsearch.shardTimeout: 300000
    
    # Security Configuration
    xpack.security.enabled: false
    xpack.encryptedSavedObjects.encryptionKey: "something_at_least_32_characters_long_production_key"
    xpack.reporting.encryptionKey: "something_at_least_32_characters_long_production_key"
    xpack.security.encryptionKey: "something_at_least_32_characters_long_production_key"
    
    # Disable problematic features that cause 500 errors
    xpack.fleet.enabled: false
    xpack.ingestManager.enabled: false
    xpack.fleet.registryUrl: ""
    xpack.fleet.agents.elasticsearch.host: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
    
    # Disable telemetry and cloud features
    telemetry.enabled: false
    xpack.telemetry.enabled: false
    xpack.telemetry.banner: false
    xpack.cloud.enabled: false
    xpack.cloud.id: ""
    xpack.cloud.base_url: ""
    
    # Disable ML and advanced features that can cause issues
    xpack.ml.enabled: false
    xpack.watcher.enabled: false
    xpack.graph.enabled: false
    xpack.canvas.enabled: false
    xpack.maps.enabled: false
    xpack.uptime.enabled: false
    xpack.apm.enabled: false
    xpack.infra.enabled: false
    xpack.logs.enabled: false
    xpack.metrics.enabled: false
    xpack.synthetics.enabled: false
    
    # Disable cloud security features (removed problematic cloudDefend)
    xpack.cloudSecurityPosture.enabled: false
    xpack.cloudExperiments.enabled: false
    xpack.cloudIntegrations.enabled: false
    
    # Performance optimizations
    optimize.bundleFilter: "!tests"
    optimize.useBundleCache: true
    optimize.watch: false
    
    # Logging configuration
    logging.appenders:
      console:
        type: console
        layout:
          type: pattern
          pattern: "[%d{ISO8601}][%-5p][%-25c] %m%n"
      file:
        type: file
        fileName: "/var/log/kibana/kibana.log"
        layout:
          type: pattern
          pattern: "[%d{ISO8601}][%-5p][%-25c] %m%n"
    logging.root:
      appenders: ["console", "file"]
      level: "info"
    logging.loggers:
      - name: "plugins.fleet"
        level: "error"
      - name: "plugins.ingestManager"
        level: "error"
      - name: "plugins.eventLog"
        level: "warn"
    
    # Monitoring configuration
    monitoring.ui.container.elasticsearch.enabled: true
    monitoring.ui.container.logstash.enabled: false
    monitoring.ui.container.beats.enabled: false
    
    # Reporting configuration
    xpack.reporting.enabled: true
    xpack.reporting.kibanaServer.hostname: "kibana-service.kibana.svc.cluster.local"
    xpack.reporting.kibanaServer.port: 5601
    xpack.reporting.kibanaServer.protocol: "http"
    
    # Data view configuration
    data.search.aggs.shardDelay.enabled: true
    data.search.aggs.shardDelay.shardDelay: "5s"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-service
  namespace: kibana
  labels:
    app: kibana
spec:
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-nodeport
  namespace: kibana
  labels:
    app: kibana
spec:
  selector:
    app: kibana
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 31381
    protocol: TCP
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: kibana
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.11.0
        ports:
        - containerPort: 5601
          name: http
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"
        - name: SERVER_NAME
          value: "kibana-production"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: ELASTICSEARCH_REQUESTTIMEOUT
          value: "300000"
        - name: XPACK_SECURITY_ENABLED
          value: "false"
        - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
          value: "something_at_least_32_characters_long_production_key"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1800"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: kibana-config
          mountPath: /usr/share/kibana/config/kibana.yml
          subPath: kibana.yml
        - name: kibana-logs
          mountPath: /var/log/kibana
        livenessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: kibana-config
        configMap:
          name: kibana-config
      - name: kibana-logs
        emptyDir: {}
      restartPolicy: Always
