apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-fixed
  namespace: monitoring
  labels:
    app: grafana-fixed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-fixed
  template:
    metadata:
      labels:
        app: grafana-fixed
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "elasticsearch"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-fixed-service
  namespace: monitoring
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana-fixed

