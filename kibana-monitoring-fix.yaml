apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: kibana
data:
  kibana.yml: |
    server.name: kibana-production
    server.host: "0.0.0.0"
    server.port: 5601
    elasticsearch.hosts: ["http://elasticsearch-service.elasticsearch.svc.cluster.local:9200"]
    elasticsearch.requestTimeout: 300000
    elasticsearch.shardTimeout: 300000
    
    # Security Configuration
    xpack.security.enabled: false
    xpack.encryptedSavedObjects.encryptionKey: "something_at_least_32_characters_long_production_key"
    
    # Disable ALL monitoring features to prevent license errors
    xpack.monitoring.enabled: false
    xpack.monitoring.ui.enabled: false
    xpack.monitoring.collection.enabled: false
    xpack.monitoring.kibana.collection.enabled: false
    xpack.monitoring.elasticsearch.collection.enabled: false
    xpack.monitoring.logstash.collection.enabled: false
    xpack.monitoring.beats.collection.enabled: false
    monitoring.ui.container.elasticsearch.enabled: false
    monitoring.ui.container.logstash.enabled: false
    monitoring.ui.container.beats.enabled: false
    monitoring.ui.container.kibana.enabled: false
    
    # Disable problematic features that cause 500 errors
    xpack.fleet.enabled: false
    xpack.ingestManager.enabled: false
    telemetry.enabled: false
    xpack.telemetry.enabled: false
    xpack.telemetry.banner: false
    xpack.ml.enabled: false
    xpack.watcher.enabled: false
    xpack.canvas.enabled: false
    xpack.maps.enabled: false
    xpack.uptime.enabled: false
    xpack.apm.enabled: false
    xpack.infra.enabled: false
    xpack.logs.enabled: false
    xpack.metrics.enabled: false
    xpack.synthetics.enabled: false
    
    # Performance optimizations
    optimize.bundleFilter: "!tests"
    optimize.useBundleCache: true
    optimize.watch: false
    
    # Logging configuration
    logging.appenders:
      console:
        type: console
        layout:
          type: pattern
          pattern: "[%d{ISO8601}][%-5p][%-25c] %m%n"
    logging.root:
      appenders: ["console"]
      level: "info"
    logging.loggers:
      - name: "plugins.monitoring"
        level: "error"
      - name: "plugins.fleet"
        level: "error"
      - name: "plugins.ingestManager"
        level: "error"
      - name: "plugins.eventLog"
        level: "warn"

