apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-comprehensive-dashboard
  namespace: monitoring
data:
  comprehensive-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "🚀 Multi-Cloud Elastic Stack - Comprehensive Dashboard",
        "tags": ["elastic", "multi-cloud", "monitoring", "presentation"],
        "style": "dark",
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "📊 System Overview",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"elasticsearch-.*\"}",
                "legendFormat": "Elasticsearch Services"
              },
              {
                "expr": "up{job=~\"kibana-.*\"}",
                "legendFormat": "Kibana Services"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "displayMode": "basic",
                  "orientation": "horizontal"
                },
                "mappings": [],
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "📈 Total Documents",
            "type": "stat",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "Total Documents"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "displayMode": "basic"
                },
                "unit": "short"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "⚡ Response Time Trends",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(elasticsearch_indices_indexing_index_time_seconds_total[5m])",
                "legendFormat": "Indexing Rate"
              },
              {
                "expr": "rate(elasticsearch_indices_search_query_time_seconds_total[5m])",
                "legendFormat": "Search Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "linear",
                  "barAlignment": 0,
                  "lineWidth": 1,
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "spanNulls": false,
                  "insertNulls": false,
                  "showPoints": "auto",
                  "pointSize": 5,
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  },
                  "axisPlacement": "auto",
                  "axisLabel": "",
                  "scaleDistribution": {
                    "type": "linear"
                  },
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  },
                  "thresholdsStyle": {
                    "mode": "off"
                  }
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 80}
                  ]
                },
                "unit": "ops"
              }
            },
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "🌍 Geographic Distribution",
            "type": "piechart",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "{{region}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  }
                },
                "mappings": []
              }
            },
            "options": {
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "pieType": "pie",
              "tooltip": {
                "mode": "single"
              },
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16}
          },
          {
            "id": 5,
            "title": "📱 Device Types",
            "type": "piechart",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "{{device}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  }
                },
                "mappings": []
              }
            },
            "options": {
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "pieType": "pie",
              "tooltip": {
                "mode": "single"
              },
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16}
          },
          {
            "id": 6,
            "title": "🌐 Browser Distribution",
            "type": "piechart",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "{{browser}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  }
                },
                "mappings": []
              }
            },
            "options": {
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "pieType": "pie",
              "tooltip": {
                "mode": "single"
              },
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16}
          },
          {
            "id": 7,
            "title": "📊 Action Types Distribution",
            "type": "bargauge",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "{{action}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  }
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 80}
                  ]
                },
                "unit": "short"
              }
            },
            "options": {
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "orientation": "horizontal",
              "displayMode": "basic"
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24}
          },
          {
            "id": 8,
            "title": "✅ Success vs Error Status",
            "type": "piechart",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "{{status}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  }
                },
                "mappings": []
              }
            },
            "options": {
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              },
              "pieType": "pie",
              "tooltip": {
                "mode": "single"
              },
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24}
          },
          {
            "id": 9,
            "title": "📈 Performance Metrics Over Time",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(elasticsearch_indices_indexing_index_total[5m])",
                "legendFormat": "Index Operations/sec"
              },
              {
                "expr": "rate(elasticsearch_indices_search_query_total[5m])",
                "legendFormat": "Search Queries/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "linear",
                  "barAlignment": 0,
                  "lineWidth": 1,
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "spanNulls": false,
                  "insertNulls": false,
                  "showPoints": "auto",
                  "pointSize": 5,
                  "stacking": {
                    "mode": "none",
                    "group": "A"
                  },
                  "axisPlacement": "auto",
                  "axisLabel": "",
                  "scaleDistribution": {
                    "type": "linear"
                  },
                  "hideFrom": {
                    "legend": false,
                    "tooltip": false,
                    "vis": false
                  },
                  "thresholdsStyle": {
                    "mode": "off"
                  }
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 80}
                  ]
                },
                "unit": "ops"
              }
            },
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 32}
          },
          {
            "id": 10,
            "title": "🔍 Top Users by Activity",
            "type": "table",
            "targets": [
              {
                "expr": "elasticsearch_indices_docs_total{index=~\"example-.*|web-logs-.*\"}",
                "legendFormat": "{{user_id}} - {{action}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "custom": {
                  "align": "auto",
                  "displayMode": "auto"
                },
                "mappings": [],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 80}
                  ]
                }
              }
            },
            "options": {
              "showHeader": true,
              "sortBy": [
                {
                  "desc": true,
                  "displayName": "Value"
                }
              ]
            },
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 40}
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning-comprehensive
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'comprehensive-dashboards'
      orgId: 1
      folder: 'Elastic Stack'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/comprehensive