apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "5s"
          queryTimeout: "60s"
          httpMethod: "POST"

      - name: AWS CloudWatch
        type: cloudwatch
        access: proxy
        jsonData:
          authType: default
          defaultRegion: us-west-2
          customMetricsNamespaces: "AWS/EC2,AWS/EKS,AWS/ELB,AWS/ES"
        secureJsonData:
          accessKey: "your-aws-access-key"
          secretKey: "your-aws-secret-key"

      - name: Azure Monitor
        type: grafana-azure-monitor-datasource
        access: proxy
        jsonData:
          subscriptionId: "your-azure-subscription-id"
          tenantId: "your-azure-tenant-id"
          clientId: "your-azure-client-id"
        secureJsonData:
          clientSecret: "your-azure-client-secret"

      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch-service.elasticsearch.svc.cluster.local:9200
        database: "logstash-*"
        jsonData:
          interval: "Daily"
          timeField: "@timestamp"
          esVersion: "8.11.0"
          maxConcurrentShardRequests: 5
          logMessageField: "message"
          logLevelField: "level"

      - name: Kibana
        type: elasticsearch
        access: proxy
        url: http://kibana-service.kibana.svc.cluster.local:5601
        database: ".kibana*"
        jsonData:
          interval: "Daily"
          timeField: "@timestamp"
          esVersion: "8.11.0"
